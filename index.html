<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SoCla">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#9b7bff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SoCla</title>
<style>
:root{--lila:#9b7bff;--rosa:#ff7fb0;--gruen:#5fd38a;--gelb:#ffd84d;--text:#3b2f5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Comic Sans MS","Segoe UI Rounded","Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#ffe3f1,#e3ecff);color:var(--text);user-select:none;-webkit-user-select:none;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:1700px;margin:0 auto;padding:6px 12px;gap:6px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:32px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff4f9a,#9b7bff,#2fa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sterne{background:#fff;border-radius:999px;padding:4px 16px;font-size:22px;font-weight:800;border:3px solid var(--gelb);box-shadow:0 3px 0 #e6c84a}
.luecke{flex:1}
button{font:inherit;color:inherit;cursor:pointer;border:none;border-radius:16px;padding:7px 13px;font-size:16px;font-weight:700;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .1s;position:relative}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
button:disabled{opacity:.45;cursor:default;transform:none}
.bunt{background:var(--lila);color:#fff}.gruen{background:var(--gruen);color:#fff}.rosa{background:var(--rosa);color:#fff}
.abzeichen{position:absolute;top:-8px;right:-8px;background:#ff4f6d;color:#fff;border-radius:999px;font-size:13px;min-width:22px;height:22px;line-height:22px;padding:0 5px;animation:huepf 1s infinite}
#orte{display:flex;gap:5px}
#orte button{flex:1;font-size:13px;padding:4px 2px;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#orte .ico{display:block;font-size:21px}
#orte button.aktiv,#raeume button.aktiv{background:var(--lila);color:#fff}
#raeume{display:flex;gap:6px;justify-content:center;min-height:30px;align-items:center}
#raeume button{padding:4px 14px;font-size:15px;border-radius:999px}
.raumname{font-weight:700;font-size:16px}
.ziel-hover{outline:4px dashed #ffb300;outline-offset:2px;filter:brightness(1.08) drop-shadow(0 0 8px #ffe066)}
.warnung{background:#fff3c4;border:2px solid #ffb300;border-radius:12px;padding:5px 12px;text-align:center;font-weight:700;display:none}
.buehne{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.szene{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(80,50,120,.25);container-type:size;border:5px solid #fff;background:#fff;touch-action:none}
#bahn{position:absolute;left:0;top:0;height:100%}
#bahn.sanft{transition:transform .5s ease}
#bahnInhalt,#effekte{position:absolute;left:0;top:0;width:100%;height:100%}
#effekte{pointer-events:none;z-index:9000}
.pfeil{position:absolute;top:44%;z-index:9500;font-size:3cqw;border-radius:50%;width:5cqw;height:5cqw;padding:0;opacity:.85}
#links{left:.8cqw}#rechts{right:.8cqw}
.tasche{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.85);border-radius:18px;padding:4px 10px;min-height:70px;border:3px dashed #cdbdf3}
.tasche b{white-space:nowrap;font-size:17px}
#taschenInhalt{flex:1;display:flex;gap:8px;overflow-x:auto;align-items:center;min-height:60px}
.tding{height:58px;min-width:40px;font-size:44px;line-height:58px;cursor:grab;touch-action:none;text-align:center}
.tding svg{height:58px;width:auto;display:block}
.leer{opacity:.6;font-size:15px}
.fuss{text-align:center;font-size:13px;opacity:.7}

/* Räume */
.raum{position:absolute;top:0;width:100cqw;height:100%;overflow:hidden}
.wand{position:absolute;left:0;right:0;top:0;height:40%}
.wandlicht{position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(rgba(74,59,102,.07),transparent 18%,transparent 80%,rgba(74,59,102,.06));pointer-events:none}
.fussboden{position:absolute;left:0;right:0;top:40%;bottom:0;overflow:hidden;perspective:30cqw;perspective-origin:50% 0}
.bodenmuster{position:absolute;left:-60%;right:-60%;top:0;height:260%;transform-origin:50% 0;transform:rotateX(58deg)}
.bodenlicht{position:absolute;inset:0;background:linear-gradient(rgba(74,40,90,.10),transparent 35%,rgba(255,255,255,.12))}
.leiste{position:absolute;left:0;right:0;top:40%;height:1.1cqw;transform:translateY(-100%);background:#fffaf3;box-shadow:0 .25cqw 0 rgba(74,40,90,.08)}
.pfeiler{position:absolute;left:0;top:0;width:1.4cqw;height:40%;background:linear-gradient(90deg,rgba(74,59,102,.14),rgba(74,59,102,.03))}
.fenster{position:absolute;top:5%;width:15cqw;transform:translateX(-50%)}
.fenster svg{width:100%;display:block}
.deckenlampe{position:absolute;left:50%;top:0;width:5cqw;transform:translateX(-50%)}
.deckenlampe svg{width:100%;display:block}
.himmel{position:absolute;inset:0 0 55% 0;background:linear-gradient(#93d9ff,#e6f8ff)}
.sonne{position:absolute;right:8cqw;top:2cqh;font-size:6.5cqw}
.wolke{position:absolute;font-size:6cqw;opacity:.95}
.huegel{position:absolute;left:-10%;right:30%;top:24%;height:22%;background:#c4efb0;border-radius:50% 50% 0 0}
.huegel.h2{left:40%;right:-15%;top:27%;background:#b2e7a0}
.hecke{position:absolute;left:0;right:0;top:34%;height:7%;background:radial-gradient(circle at 2.5cqw 2.5cqw,#7fd38a 2.4cqw,transparent 2.5cqw) 0 0/5cqw 5cqw}
.gras{position:absolute;left:0;right:0;top:40%;bottom:0;overflow:hidden;perspective:30cqw;perspective-origin:50% 0}
.gras.sand{top:46%}
.meer{position:absolute;left:0;right:0;top:28%;height:19%;background:linear-gradient(#5ec6ec,#8fdcf5);overflow:hidden}
.welle{position:absolute;left:-10%;right:-10%;top:30%;height:30%;background:radial-gradient(ellipse at 3cqw 0,rgba(255,255,255,.55) 1.2cqw,transparent 1.4cqw) 0 0/6cqw 2cqw;animation:wellen 4s linear infinite}
.gischt{position:absolute;left:0;right:0;top:45%;height:2.4%;background:radial-gradient(ellipse at 2.5cqw 50%,#ffffff 1.8cqw,transparent 2cqw) 0 0/5cqw 100%;opacity:.85}

/* Dinge und Figuren */
.ding{position:absolute;transform:translate(-50%,-100%);cursor:grab;touch-action:none}
.ding svg{width:100%;display:block;overflow:visible}
.ding.klein{line-height:1;filter:drop-shadow(0 .3cqw 0 rgba(0,0,0,.13))}

.ding.fest{cursor:pointer}
.ding.gleitet{transition:left .6s ease-in-out,top .45s cubic-bezier(.55,0,1,.45)}
.figur .name{position:absolute;left:50%;bottom:-1.7cqw;transform:translateX(-50%);font-size:1.15cqw;background:rgba(255,255,255,.9);border-radius:1cqw;padding:0 .5cqw;font-weight:700;white-space:nowrap;pointer-events:none}
.figur.liegt{transform:translate(-50%,-50%) rotate(-90deg)}
.figur.liegt .name{display:none}
.figur .zzz{position:absolute;right:-1.5cqw;top:-1cqw;font-size:2.4cqw;animation:huepf 1.6s infinite;rotate:90deg}
.hand{position:absolute;left:75.5%;top:69%;transform:translate(-50%,-50%);line-height:1;cursor:grab}
.hand svg{width:100%}
.imfach{position:absolute;transform:translate(-50%,-100%);line-height:1;cursor:grab}
.pfl{position:absolute;right:-.2em;top:-.1em;font-size:.45em}
.vorne{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.vorne svg{width:100%;display:block;overflow:visible}
.huepft>svg{animation:huepfGross .5s}
.wackelt{animation:wackel .45s}
.schaukelt{animation:schaukel .75s ease-in-out 4 alternate}
.geist{position:fixed;pointer-events:none;z-index:8000;opacity:.95;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25));cursor:grabbing}
.geist svg{width:100%;display:block;overflow:visible}
.geist .hand{position:absolute;left:75.5%;top:69%;transform:translate(-50%,-50%);line-height:1}
.herz{position:absolute;font-size:3cqw;animation:hoch 1.2s forwards}
.blase{position:absolute;transform:translate(-50%,-112%);background:#fff;border:3px solid var(--lila);border-radius:16px;padding:6px 12px;font-size:max(14px,1.5cqw);font-weight:700;white-space:nowrap;text-align:center;pointer-events:auto;box-shadow:0 4px 12px rgba(60,30,90,.2)}
.blase::after{content:"";position:absolute;left:50%;bottom:-12px;border:9px solid transparent;border-top-color:var(--lila);transform:translateX(-50%)}
.blase button{margin-top:6px;font-size:max(13px,1.3cqw);padding:4px 10px;background:var(--lila);color:#fff}

/* Bewegte Teile in den Zeichnungen */
.atmen{animation:atmen 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.augen{animation:blinzeln 5s infinite;transform-box:fill-box;transform-origin:center}
.tvbild{animation:tv 4s linear infinite}
.leuchten{animation:leuchten 2s ease-in-out infinite}
.noten{animation:noten 1.6s ease-out infinite}.n2{animation-delay:.8s}
.tropfen path{animation:tropfen .5s linear infinite}
.wasser{animation:wasser .3s infinite alternate}
.schaum{animation:schaum 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.trommel{animation:drehen .8s linear infinite;transform-box:view-box;transform-origin:30px 42px}
.fisch{animation:fisch 5s ease-in-out infinite alternate}.f2{animation-duration:3.8s;animation-direction:alternate-reverse}
.flamme{animation:flamme .25s infinite alternate}
.dampf{animation:dampf 1.4s ease-out infinite}
.glut{animation:leuchten .8s infinite}
.schwing{animation:schwingen .75s ease-in-out infinite alternate;transform-box:view-box}
.wellen{animation:fisch 3s ease-in-out infinite alternate}
.film{animation:tv 6s linear infinite}
.flieger{animation:flieger 3s ease-in-out infinite alternate}

/* Dialoge */
#schleier{position:fixed;inset:0;background:rgba(60,30,90,.38);display:none;align-items:center;justify-content:center;z-index:10000}
#karte{background:#fff;border-radius:26px;padding:20px 24px;width:min(1000px,95vw);max-height:92vh;overflow:auto;position:relative;box-shadow:0 10px 40px rgba(60,30,90,.35)}
#karte h2{margin:0 40px 12px 0;font-size:26px}
.klein{font-size:16px;font-weight:400}
.gross-text{font-size:20px}
.zu{position:absolute;right:14px;top:14px;padding:6px 12px}
.reiter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.reiter button{font-size:15px;padding:6px 11px}
.reiter button.aktiv{background:var(--lila);color:#fff}
.waren,.figurenliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ware{background:#f7f3ff;border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center}
.ware .gross{font-size:46px;line-height:1.1}
.ware .bildchen{height:74px;display:flex;align-items:flex-end;justify-content:center}
.ware .bildchen svg{max-height:74px;max-width:120px;width:auto;height:auto;overflow:visible}
.ware button{width:100%}
.mini{height:130px}.mini svg{height:130px;width:auto}
.baukasten{display:grid;grid-template-columns:220px 1fr;gap:18px}
.vorschau{background:linear-gradient(#f3e6ff,#ffe3f1);border-radius:20px;padding:12px;align-self:start;position:sticky;top:0;display:flex;flex-direction:column;gap:8px}
.vorschau svg{width:100%;overflow:visible}
.gruppe{margin-bottom:10px}
.gruppe b{display:block;margin-bottom:4px}
.opt{padding:6px 10px;font-size:15px;margin:0 4px 4px 0;border:3px solid transparent}
.opt.an,.muster.an{border-color:var(--lila)}
.opt.frage,.muster.frage{background:var(--gelb)}
.farbe{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #0002;vertical-align:middle}
.musterliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.muster{display:flex;flex-direction:column;gap:4px;align-items:stretch;font-size:14px;border:3px solid transparent;padding:6px}
.probe{display:block;height:48px;border-radius:10px;border:1px solid #0001;container-type:inline-size}
.hinweis{background:#fff6d6;border-radius:12px;padding:8px 12px}
input[type=text]{font:inherit;font-size:18px;padding:6px 10px;border-radius:10px;border:2px solid #d9cdf5;width:100%}
.aufgabe{display:flex;align-items:center;gap:12px;background:#f7f3ff;border-radius:16px;padding:10px 14px;margin-bottom:8px}
.aufgabe .text{flex:1;font-size:17px}
.lohn{white-space:nowrap}
.balken{height:10px;background:#e6defa;border-radius:6px;overflow:hidden;margin-top:5px}
.balken div{height:100%;background:linear-gradient(90deg,var(--gruen),#b6f06b)}
.frage-text{font-size:28px;font-weight:800;margin:14px 0 18px;text-align:center}
.antworten{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.antworten button{font-size:22px;padding:16px}
.antworten .richtig{background:var(--gruen);color:#fff}
.antworten .falsch{background:#ffb3c1}
.rueckmeldung{text-align:center;font-size:20px;margin-top:14px;min-height:28px}
#malflaeche{width:100%;border-radius:12px;border:8px solid #b9855a;touch-action:none;cursor:crosshair;display:block}
.malleiste{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.farbknopf{width:40px;height:40px;border-radius:50%;padding:0;border:4px solid #fff;box-shadow:0 0 0 2px #0002}
.farbknopf.an{box-shadow:0 0 0 4px var(--lila)}
.hilfe{font-size:17px;line-height:1.55;padding-left:22px}
.dateiknopf{display:inline-block;margin:6px 0 0 6px;padding:7px 13px;border-radius:16px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15);font-weight:700;cursor:pointer}
.dateiknopf input{display:none}
#toast{pointer-events:none;position:fixed;left:50%;top:150px;transform:translateX(-50%);background:#fff;border:3px solid var(--lila);border-radius:18px;padding:10px 18px;font-size:19px;font-weight:700;z-index:11000;box-shadow:0 6px 18px rgba(60,30,90,.25);display:none;max-width:90vw;text-align:center}
.plus{position:fixed;font-size:26px;font-weight:900;color:#e0a800;pointer-events:none;z-index:12000;animation:hoch 1.3s forwards;text-shadow:0 2px 0 #fff}

@keyframes hoch{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
@keyframes huepf{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes huepfGross{0%,100%{transform:translateY(0)}40%{transform:translateY(-14%)}}
@keyframes wackel{0%,100%{rotate:0deg}25%{rotate:-10deg}75%{rotate:10deg}}
@keyframes schaukel{from{translate:-1.5cqw 0;rotate:-6deg}to{translate:1.5cqw 0;rotate:6deg}}
@keyframes schwingen{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes atmen{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes blinzeln{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes tv{to{filter:hue-rotate(360deg)}}
@keyframes leuchten{0%,100%{opacity:.45}50%{opacity:.7}}
@keyframes noten{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-14px)}}
@keyframes tropfen{to{stroke-dashoffset:-22}}
@keyframes wasser{from{opacity:.6}to{opacity:1}}
@keyframes schaum{from{transform:scale(.9)}to{transform:scale(1.1)}}
@keyframes drehen{to{transform:rotate(360deg)}}
@keyframes fisch{from{transform:translateX(-12px)}to{transform:translateX(14px)}}
@keyframes flamme{from{opacity:.6}to{opacity:1}}
@keyframes dampf{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-8px)}}
@keyframes wellen{from{transform:translateX(0)}to{transform:translateX(6cqw)}}
@keyframes flieger{from{transform:translate(-40px,10px)}to{transform:translate(30px,-8px)}}
/* Tablet: Finger statt Maus */
html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body{font-family:"Chalkboard SE","Comic Sans MS","Segoe UI Rounded",system-ui,sans-serif;position:fixed;inset:0}
#app{padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
button,label{touch-action:manipulation}
#karte{touch-action:pan-y;-webkit-overflow-scrolling:touch}
#taschenInhalt{touch-action:pan-x}
.hochkant{display:none}
@media (orientation:portrait){.hochkant{display:flex;position:fixed;inset:0;z-index:20000;background:linear-gradient(135deg,#ffe3f1,#e3ecff);align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:30px;font-weight:800;text-align:center;color:#3b2f5c}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">SoCla</span>
    <span class="sterne">⭐ <span id="sternZahl">0</span></span>
    <span class="luecke"></span>
    <button class="bunt" id="knopfAufgaben" onclick="zeigeAufgaben()">📋 Aufgaben</button>
    <button class="gruen" onclick="neueFrage()">🧠 Wissensfrage</button>
    <button onclick="zeigeFiguren()">👤 Figuren</button>
    <button class="rosa" id="knopfEinrichten" onclick="oeffneEinrichten()">🎨 Einrichten</button>
    <button id="knopfTon" onclick="tonUmschalten()">🔊</button>
    <button onclick="zeigeHilfe()">❓</button>
  </header>
  <nav id="orte"></nav>
  <div id="raeume"></div>
  <div class="warnung" id="warnung"></div>
  <div class="buehne">
    <div class="szene" id="szene">
      <div id="bahn"><div id="bahnInhalt"></div><div id="effekte"></div></div>
      <button class="pfeil" id="links" onclick="blaettern(-1)">◀</button>
      <button class="pfeil" id="rechts" onclick="blaettern(1)">▶</button>
    </div>
  </div>
  <div class="tasche" data-tasche><b>🎒 Tasche</b><div id="taschenInhalt"></div></div>
  <div class="fuss">Alles mit dem Finger anfassen und ziehen. Antippen probiert Dinge aus. Zieh etwas oben auf einen Ort oder in die Tasche, um es mitzunehmen.</div>
</div>
<div id="schleier"><div id="karte"></div></div>
<div id="toast"></div>
<div class="hochkant"><div style="font-size:70px">🔄</div>Bitte das iPad quer halten</div>
<script>window.SOCLA_MODUS = "tablet";</script>
<script src="js/daten.js"></script>
<script src="js/grafik.js"></script>
<script src="js/spiel.js"></script>
</body>
</html>
